; Development builds of the examples against the library in this repo.
; Users of the library don't need this file.
;
;   pio run                                  build every board
;   pio run -e esp32-s3 -t upload            flash the example to an S3

[platformio]
src_dir = examples/SerialMidi

[env]
framework = arduino
platform = espressif32
lib_deps = symlink://.

[env:esp32-s3]
board = esp32-s3-devkitc-1
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

[env:esp32]
board = esp32dev

[env:esp32-s2]
board = esp32-s2-saola-1

[env:esp32-c3]
board = esp32-c3-devkitm-1
