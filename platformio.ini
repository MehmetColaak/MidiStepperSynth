; Development build: flashes the UsbMidi example to an ESP32-S3.
; Users of the library don't need this file.
;
;   pio run -t upload
;
; Compile any example for any board without this file:
;   pio ci examples/SerialMidi --lib . --board esp32dev

[platformio]
src_dir = examples/UsbMidi

[env:esp32-s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
lib_deps = symlink://.
build_flags =
    -D ARDUINO_USB_MODE=0
    -D ARDUINO_USB_CDC_ON_BOOT=1
